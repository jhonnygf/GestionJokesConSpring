<div class="categories-list-container">
  <div class="header">
    <h1>Listado de Categorías</h1>
    <div class="search-container">
      <input class="search-input" type="text" placeholder="Buscar por categoría" [(ngModel)]="filtro"
        (input)="aplicarFiltro()" />
      <button class="search-button" (click)="aplicarFiltro()">🔍</button>
    </div>

    <button mat-raised-button color="primary" routerLink="/categories/nuevo">
      Nueva Categoría
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let category">
        <span class="badge bg-primary rounded-pill">{{ category.id }}</span>
      </td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let category">{{ category.category }}</td>
    </ng-container>

    <!-- Columna Jokes Relacionados -->
    <ng-container matColumnDef="jokes">
      <th mat-header-cell *matHeaderCellDef>Jokes Relacionados</th>
      <td mat-cell *matCellDef="let category">
        <span *ngIf="category.jokes && category.jokes.length > 0">
          {{ category.jokes.length }} chistes
        </span>
        <span *ngIf="!category.jokes || category.jokes.length === 0">Sin jokes</span>
      </td>
    </ng-container>


    <!-- Columna Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let category">
        <!-- Botón Consultar -->


        <button class="btn btn-success btn-sm me-2" (click)="consultarCategory(category.id)">
          🔍 Consultar
        </button>


        <button class="btn btn-warning btn-sm me-2" [routerLink]="['/categories/editar', category.id]">
          ✏️ Editar
        </button>

        <button class="btn btn-danger btn-sm" (click)="eliminarCategoria(category.id, category.category)">
          🗑️Eliminar
        </button>



      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
</div>
