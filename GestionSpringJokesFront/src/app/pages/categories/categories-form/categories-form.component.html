<div class="background-gradient">
  <div class="category-form-wrapper">
    <mat-card class="category-form-card" *ngIf="!loading; else loadingTemplate">
      <mat-card-title class="card-title">
        <mat-icon>category</mat-icon>
        {{ isEditMode ? 'Editar Categoría' : 'Nueva Categoría' }}
      </mat-card-title>

      <mat-card-content>
        <form [formGroup]="categoryForm" (ngSubmit)="guardarCategoria()" class="category-form">

          <!-- Mostrar solo en modo edición (ID deshabilitado) -->
          <mat-form-field *ngIf="isEditMode" appearance="fill" class="form-field">
            <mat-label>ID de la Categoría</mat-label>
            <input matInput formControlName="id" readonly />
          </mat-form-field>

          <!-- Nombre de la Categoría -->
          <mat-form-field appearance="fill" class="form-field">
            <mat-label>Nombre de la Categoría</mat-label>
            <input matInput formControlName="category" />
            <mat-error *ngIf="categoryForm.get('category')?.invalid">
              El nombre es obligatorio y debe tener entre 3 y 30 caracteres.
            </mat-error>
          </mat-form-field>

          <!-- BOTONES -->
          <div class="button-group">
            <button mat-raised-button color="primary" type="submit" [disabled]="categoryForm.invalid">
              {{ isEditMode ? 'Guardar' : 'Crear' }}
            </button>

            <button mat-stroked-button color="warn" routerLink="/categories">
              Cancelar
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>

    <!-- Cargando -->
    <ng-template #loadingTemplate>
      <div class="loading-container">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
        <p>Cargando...</p>
      </div>
    </ng-template>
  </div>
</div>
