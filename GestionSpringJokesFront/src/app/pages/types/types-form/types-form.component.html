<div class="background-gradient">
    <div class="type-form-wrapper">
      <mat-card class="type-form-card" *ngIf="!loading; else loadingTemplate">
        <mat-card-title class="card-title">
          <mat-icon>category</mat-icon>
          {{ isEditMode ? 'Editar Type' : 'Nuevo Type' }}
        </mat-card-title>
  
        <mat-card-content>
          <form [formGroup]="typeForm" (ngSubmit)="guardarType()" class="type-form">
            <!-- Mostrar el campo ID solo en modo edición -->
            <mat-form-field *ngIf="isEditMode" appearance="fill" class="form-field">
              <mat-label>ID</mat-label>
              <input matInput formControlName="id" readonly />
            </mat-form-field>
  
            <!-- Campo para el nombre o descripción del Type -->
            <mat-form-field appearance="fill" class="form-field">
              <mat-label>Nombre del Type</mat-label>
              <input matInput formControlName="type" />
              <mat-error *ngIf="typeForm.get('type')?.invalid">
                El nombre es obligatorio y debe tener entre 3 y 30 caracteres.
              </mat-error>
            </mat-form-field>
  
            <!-- BOTONES -->
            <div class="button-group">
              <button mat-raised-button color="primary" type="submit" [disabled]="typeForm.invalid">
                {{ isEditMode ? 'Guardar' : 'Crear' }}
              </button>
              <button mat-stroked-button color="warn" routerLink="/types">
                Cancelar
              </button>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
  
      <!-- Plantilla para mostrar mientras se carga -->
      <ng-template #loadingTemplate>
        <div class="loading-container">
          <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
          <p>Cargando...</p>
        </div>
      </ng-template>
    </div>
  </div>
