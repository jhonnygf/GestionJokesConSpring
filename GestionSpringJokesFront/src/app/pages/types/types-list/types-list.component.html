<div class="types-list-container">
  <div class="header">
    <h1>Listado de Types</h1>
    <div class="search-container">
      <input class="search-input" type="text" placeholder="Buscar type" [(ngModel)]="filtro"
        (input)="aplicarFiltro()" />
      <button class="search-button" (click)="aplicarFiltro()">🔍</button>
    </div>
    <button mat-raised-button color="primary" routerLink="/types/nuevo">
      Nuevo Type
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let type">
        <span class="badge bg-primary rounded-pill">{{ type.id }}</span>
      </td>
    </ng-container>

    <!-- Columna Type -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let type">{{ type.type }}</td>
    </ng-container>

    <!-- Columna Jokes Asociados -->
    <ng-container matColumnDef="jokeCount">
      <th mat-header-cell *matHeaderCellDef>Jokes Asociados</th>
      <td mat-cell *matCellDef="let type">
        <span *ngIf="type.jokeCount > 0">{{ type.jokeCount }} chistes</span>
        <span *ngIf="type.jokeCount === 0">Sin chistes</span>
      </td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let type">
        <button class="btn btn-success btn-sm me-2" (click)="consultarType(type.id)">🔍 Consultar</button>
        <button class="btn btn-warning btn-sm me-2" [routerLink]="['/types/editar', type.id]"> ✏️ Editar</button>
        <button class="btn btn-danger btn-sm" (click)="eliminarType(type.id, type.type)"> 🗑️ Eliminar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
</div>
